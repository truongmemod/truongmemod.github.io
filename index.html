<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Quản lý dược phẩm</title>

    <style>
        body {
            background: #f2f2f2;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #f5e85c;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 260px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            margin: 10px 0 20px;
        }

        .pin-display {
            font-size: 24px;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .keypad button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #ddd;
            cursor: pointer;
        }

        .keypad button:hover {
            background: #ccc;
        }

        .clear {
            background: #ff8c8c;
        }

        .enter {
            background: #90ee90;
        }

        .login-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #5aa7d8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #3d8fc1;
        }
    </style>
</head>

<body>

<div class="login-container">
    
    <div class="logo">💊</div>

    <h2>Quản lý dược phẩm</h2>
    <h2>Hệ thống đăng nhập</h2>

    <div class="pin-display">
        ● ● ● ●
    </div>

    <div class="keypad">
        <button>1</button>
        <button>2</button>
        <button>3</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>

       <button class="enter"></button>
        <button>0</button>
        <button class="enter">⌫</button>
    </div>

    <button class="login-btn">Đăng nhập</button>

</div>

</body>
</html>
